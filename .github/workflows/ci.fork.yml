name: CI fork

# Lean CI for the personal fork: everything runs on Linux runners (the upstream macOS/Windows
# build matrix is manual-only, see ci.build.yml). The Rust job also proves the non-macOS build.
on:
  push:
    branches:
      - '**'
      # Holds only the updater's channel manifests (no code), committed by scripts/release/publish.mjs.
      - '!update-channels'
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (format, lint, types, tests)
    runs-on: ubuntu-latest
    env:
      # Normally set by vite.config.ts / the untracked apps/desktop/.env; `$env/static/public` needs it
      PUBLIC_APP_VERSION: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn eslint "**/*.{ts,js,svelte}"

      - name: Type-check
        run: yarn check:svelte

      - name: Tests
        run: yarn test

  rust:
    name: Rust (clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libasound2-dev libdbus-1-dev libssl-dev pkg-config patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-19
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: fork-ubuntu
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --features desktop -- -D warnings

      - name: Tests
        run: cargo test --features desktop --lib
