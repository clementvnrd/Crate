name: Release

# Backup release path for the personal fork (the default is `yarn release:local` on the Mac, see
# docs/RELEASING.md). On a `v*` tag it builds Crate for Apple Silicon, signs the updater bundle,
# attaches it to a release of this private repository and, when the `RELEASES_REPO_TOKEN` secret
# exists, publishes it to the public releases repository the in-app updater reads.
# macOS runners are billed 10x on a private repository: this workflow runs on tags only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match package.json, e.g. 0.3.0-staging.1)'
        required: true
        type: string
      publish:
        description: 'Publish to the public releases repository (otherwise build and archive only)'
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      channel: ${{ steps.validate.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version and channel
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=production; PRERELEASE=false
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-staging\.[0-9]+$ ]]; then
            CHANNEL=staging; PRERELEASE=true
          else
            echo "::error::Invalid version '$VERSION': use X.Y.Z or X.Y.Z-staging.N"
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "::error::package.json is at $PACKAGE_VERSION, not $VERSION: run 'yarn bump' before tagging"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: node scripts/release/notes.mjs "$VERSION" "$GITHUB_SHA" > release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  build:
    name: Build macOS (Apple Silicon)
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-19
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-macos
          cache-targets: true
          cache-on-failure: true

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # No Apple Developer certificate yet: the bundle is ad-hoc signed (`signingIdentity: "-"` in
      # tauri.conf.json) and the first install goes through Privacy & Security → "Open Anyway".
      # To notarise later, add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      # APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID as secrets and pass them to this step.
      - name: Build Tauri app
        run: >-
          yarn tauri build
          --config src-tauri/tauri.${{ needs.validate.outputs.channel == 'staging' && 'staging' || 'prod' }}.conf.json
          --target aarch64-apple-darwin
          -- --features ${{ needs.validate.outputs.channel == 'staging' && 'desktop,devtools' || 'desktop' }}
        env:
          CRATE_ENV: ${{ needs.validate.outputs.channel }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  release:
    name: Archive and publish
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Archive in this private repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Crate ${{ needs.validate.outputs.version }}
          body_path: artifacts/release-notes/release_notes.md
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: |
            artifacts/release-macos/**/*.dmg
            artifacts/release-macos/**/*.app.tar.gz
            artifacts/release-macos/**/*.app.tar.gz.sig

      - name: Publish to the public releases repository
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::warning::RELEASES_REPO_TOKEN is not set: the build is archived here but not published. Publish from the Mac with 'yarn release:publish --version $VERSION --bundle-dir <downloaded artifacts>'."
            exit 0
          fi
          node scripts/release/publish.mjs --version "$VERSION" --bundle-dir artifacts/release-macos
