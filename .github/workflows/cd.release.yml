name: Release

# Default release path for the personal fork (CRA-198 Q4; the backup is `yarn release:local` on the
# Mac, see docs/RELEASING.md). On a `v*` tag it builds Crate for Apple Silicon, signs the updater
# bundle, publishes it as a GitHub release of this public repository and points the channel's
# `latest.json` (branch `update-channels`) at it, all with the workflow's own token (CRA-198 Q1).
# It runs on tags only: a release is always the build of its tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match package.json, e.g. 1.0.0-staging.1)'
        required: true
        type: string
      publish:
        description: 'Publish the release and update its channel (otherwise build only: the files stay downloadable from the run)'
        required: false
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      channel: ${{ steps.validate.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version and channel
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          # The app downloads releases without credentials: from a private repository it gets 404, and
          # macOS runners are billed 10x there. Stop before the build.
          if [[ "$REPO_PRIVATE" == "true" ]]; then
            echo "::error::The repository is still private: make it public before releasing (CRA-198)"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
            # A release is the build of its tag: a manual run must be started from that tag.
            if [[ "$REF_TYPE" != "tag" || "$REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Start the run from the tag v$VERSION ('Use workflow from'), not from $REF_TYPE $REF_NAME"
              exit 1
            fi
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=production; PRERELEASE=false
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-staging\.[0-9]+$ ]]; then
            CHANNEL=staging; PRERELEASE=true
          else
            echo "::error::Invalid version '$VERSION': use X.Y.Z or X.Y.Z-staging.N"
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "::error::package.json is at $PACKAGE_VERSION, not $VERSION: run 'yarn bump' before tagging"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      # Fails here, before half an hour of macOS build, when CHANGELOG.md has no section for the version.
      - name: Check the release notes exist in CHANGELOG
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: node scripts/release/notes.mjs "$VERSION" "$GITHUB_SHA" > /dev/null

  build:
    name: Build macOS (Apple Silicon)
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-19
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-macos
          cache-targets: true
          cache-on-failure: true

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # No Apple Developer certificate yet: the bundle is ad-hoc signed (`signingIdentity: "-"` in
      # tauri.conf.json) and the first install goes through Privacy & Security → "Open Anyway".
      # To notarise later, add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
      # APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID as secrets and pass them to this step.
      # No `--` here: through `yarn tauri`, Yarn 1 drops every option written before `--`.
      - name: Build Tauri app
        run: >-
          yarn tauri build
          --config src-tauri/tauri.${{ needs.validate.outputs.channel == 'staging' && 'staging' || 'prod' }}.conf.json
          --target aarch64-apple-darwin
          --features ${{ needs.validate.outputs.channel == 'staging' && 'desktop,devtools' || 'desktop' }}
        env:
          CRATE_ENV: ${{ needs.validate.outputs.channel }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  release:
    name: Publish
    needs: [validate, build]
    if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: artifacts/release-macos

      # publish.mjs refuses unless the tag names this commit, the archive holds this version and its
      # signature verifies against the key the installed apps trust; it never replaces a release.
      - name: Publish the release and update its channel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/release/publish.mjs --version "$VERSION" --bundle-dir artifacts/release-macos
